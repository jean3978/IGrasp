name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: IGrasp version
      description: Shown in Help › About IGrasp.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (please give the distribution below)
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS details
      placeholder: Ubuntu 24.04, GNOME on Wayland
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder…
        2. Click…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Attach `igrasp.log` from the `logs` folder of the app data directory (Help › About IGrasp
        shows its path).
      render: text
