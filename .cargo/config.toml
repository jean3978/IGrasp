# Cargo reads this file from the current directory and its parents, so it applies both to
# `npm run rust:*` (run from the repository root) and to `cargo` run inside `src-tauri/`.
[env]
# TypeScript bindings generated by ts-rs during `cargo test`.
TS_RS_EXPORT_DIR = { value = "src/ipc/generated", relative = true }
# Sizes and timestamps fit in a JS number (< 2^53); avoid `bigint` in the frontend.
TS_RS_LARGE_INT = "number"
