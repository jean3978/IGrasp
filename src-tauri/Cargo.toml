[package]
name = "igrasp"
version = "0.1.0"
description = "Read the markdown documentation of a project and grasp what AI agents are writing."
authors = ["Jean-Rene Choiniere"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "igrasp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ts-rs = "12.0.1"
dunce = "1.0.5"
log = "0.4.34"
tempfile = "3.27.0"
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.3"
ignore = "0.4.33"
tauri-plugin-opener = "2.7.2"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
tauri-plugin-window-state = "2.5.0"
regex = "1.13.1"

[lints.rust]
unsafe_code = "deny"
