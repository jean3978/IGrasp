[package]
name = "igrasp"
version = "0.5.0"
description = "Read the markdown documentation of a project and grasp what AI agents are writing."
authors = ["Jean-Rene Choiniere"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "igrasp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
dunce = "1.0.5"
log = "0.4.34"
tempfile = "3.27.0"
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.3"
ignore = "0.4.33"
tauri-plugin-opener = "2.7.2"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
tauri-plugin-window-state = "2.5.0"
regex = "1.13.1"
pulldown-cmark = { version = "0.13.5", default-features = false }
nucleo-matcher = "0.3.1"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
grep-matcher = "0.1.9"
globset = "0.4.20"
which = "8.0.6"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# Phase 5 proof of concept (tutorials): YAML blocks of the shared markdown and SHA-256 of cited lines.
serde_yaml = "0.9.34"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
# Job object that kills AI subprocesses with the app (ADR 0015).
win32job = "2.0.3"

[lints.rust]
unsafe_code = "deny"
